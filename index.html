<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Econ 10000: mind map, notes, and practice lab</title>
<style>
:root{
  color-scheme:light;
  --paper:#F5F8FA; --sheet:#FFFFFF; --rule:#D3DDE6;
  --ink:#1E2B45; --ink-soft:#56627A; --accent:#4C51BF; --focus:#F2B705;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark; --paper:#152036; --sheet:#1B2741; --rule:#31415F; --ink:#E6ECF5; --ink-soft:#A7B3C9; --accent:#9A9FF5}
}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{display:flex; flex-direction:column; font-family:var(--body); color:var(--ink); background:var(--paper)}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:6px}

.bar{display:flex; flex-wrap:wrap; align-items:center; gap:8px 18px; padding:10px 16px; background:var(--sheet); border-bottom:1px solid var(--rule)}
.bar h1{font-size:1.05rem; margin:0; letter-spacing:-.01em}
.tabs{display:flex; flex-wrap:wrap; gap:6px}
.tabs button{font:inherit; font-size:.92rem; color:var(--ink); background:transparent; border:1.5px solid var(--ink); border-radius:999px; padding:5px 14px; cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.tabs button[hidden]{display:none}
.open{margin-left:auto; font-size:.88rem; color:var(--ink-soft); display:flex; flex-wrap:wrap; gap:14px}
.open a{color:inherit; text-underline-offset:3px}
.open a:hover{color:var(--ink)}

.stage{flex:1; min-height:0; display:grid; grid-template-columns:1fr}
.stage iframe{width:100%; height:100%; border:0; background:var(--paper); min-height:0; display:none}
.stage[data-view="map"]      #map,
.stage[data-view="notes"]    #notes,
.stage[data-view="practice"] #practice,
.stage[data-view="both"]     #map,
.stage[data-view="both"]     #notes{display:block}
.stage[data-view="both"]{grid-template-columns:1fr 1fr}
.stage[data-view="both"] #map{border-right:1px solid var(--rule)}

@media (max-width:640px){
  .open{margin-left:0; width:100%}
}
</style>
</head>
<body>

<header class="bar">
  <h1>Econ 10000, lectures 1–6</h1>
  <div class="tabs" role="group" aria-label="Choose what to show">
    <button type="button" data-view="map">Mind map</button>
    <button type="button" data-view="notes">Full notes</button>
    <button type="button" data-view="both" id="bothBtn">Side by side</button>
    <button type="button" data-view="practice">Practice lab</button>
  </div>
  <nav class="open" aria-label="Open on its own page">
    <a href="econ10000-mindmap/">Mind map on its own</a>
    <a href="econ10000-summary/">Full notes on their own</a>
    <a href="econ10000-practice/">Practice lab on its own</a>
  </nav>
</header>

<main class="stage" id="stage" data-view="map">
  <iframe id="map" src="econ10000-mindmap/" title="Mind map of lectures 1 to 4" loading="eager"></iframe>
  <iframe id="notes" src="econ10000-summary/" title="Full written notes for lectures 1 to 4" loading="lazy"></iframe>
  <iframe id="practice" src="econ10000-practice/" title="Interactive consumer theory practice lab" loading="lazy"></iframe>
</main>

<noscript>
  <p style="padding:16px">This page needs JavaScript to switch views. Open the <a href="econ10000-mindmap/">mind map</a>, the <a href="econ10000-summary/">full notes</a>, or the <a href="econ10000-practice/">practice lab</a> directly.</p>
</noscript>

<script>
(function(){
  var stage = document.getElementById('stage');
  var buttons = [].slice.call(document.querySelectorAll('.tabs button'));
  var bothBtn = document.getElementById('bothBtn');
  var wide = window.matchMedia('(min-width: 1000px)');
  var names = {map:'map', notes:'notes', both:'both', practice:'practice'};

  function fromHash(){
    var h = location.hash.replace('#','');
    return names[h] || (wide.matches ? 'both' : 'map');
  }
  function show(view, push){
    if (view === 'both' && !wide.matches) view = 'map';
    stage.setAttribute('data-view', view);
    buttons.forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.view === view)); });
    if (push && location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
  }
  function syncWide(){
    bothBtn.hidden = !wide.matches;
    show(fromHash(), false);
  }
  buttons.forEach(function(b){ b.addEventListener('click', function(){ show(b.dataset.view, true); }); });
  window.addEventListener('hashchange', function(){ show(fromHash(), false); });
  (wide.addEventListener ? wide.addEventListener('change', syncWide) : wide.addListener(syncWide));
  syncWide();

  // Sub-pages link back to "../". Inside a frame, send that click to the hub's mind map view instead of nesting the hub.
  ['notes','practice'].forEach(function(id){
    var frame = document.getElementById(id);
    function patchLinks(){
      try {
        [].slice.call(frame.contentDocument.querySelectorAll('a[href="../"]')).forEach(function(a){
          a.setAttribute('href', '../#map'); a.setAttribute('target', '_top');
        });
      } catch (e) {}
    }
    frame.addEventListener('load', patchLinks);
    patchLinks();
  });
})();
</script>
</body>
</html>
